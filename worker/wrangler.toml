# Fonction en ligne des suggestions par l'IA.
# Déployer :  npx wrangler@4.148.0 deploy   (depuis ce dossier)
# La clé :    npx wrangler@4.148.0 secret put OPENAI_API_KEY
name = "encadrement-ia"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
OPENAI_MODEL = "gpt-5.6-luna"
PLAFOND_JOUR_USD = "0.50"
QUOTA_ADRESSE = "30"
ORIGINES = "https://magellanpic.github.io,http://localhost:8765"
CATALOGUE_URL = "https://magellanpic.github.io/encadrement-prototype/catalogue.json"

# Dépense du jour et quotas par adresse
[[kv_namespaces]]
binding = "DEPENSE"
id = "14a776f1e6bf4770806ad2d5185c0421"

[observability]
enabled = true
